<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="cache-control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="pragma" content="no-cache">
<meta http-equiv="expires" content="0">
<meta name="robots" content="noindex">
<title>Acacia HBC — Company Presentation</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23141414'/%3E%3Crect x='9' y='10' width='14' height='2' fill='%23fff'/%3E%3Crect x='9' y='15' width='14' height='2' fill='%23fff'/%3E%3Crect x='9' y='20' width='9' height='2' fill='%23fff'/%3E%3C/svg%3E">

<!-- ==========================================================
     EDIT BELOW. Nothing else in this file needs to change.
     Set TARGET to "primary" or "mirror". Commit. Done.
     ========================================================== -->
<script>
  const TARGET  = "primary";

  const PRIMARY = "https://canva.link/49a2qs6kbfw8xck";
  const MIRROR  = "https://drive.google.com/drive/folders/1uzAn3DiTLpW6QfQKa8ubvSNU5Kk_VCeF";
</script>
<!-- ========================================================== -->

<style>
  :root {
    --ink:   #141414;
    --paper: #faf9f7;
    --rule:  #d8d4cd;
    --mute:  #6f6a63;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--paper);
    color: var(--ink);
    font: 400 16px/1.55 ui-sans-serif, -apple-system, "Helvetica Neue", Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 24px;
    -webkit-font-smoothing: antialiased;
  }
  main {
    width: 100%;
    max-width: 380px;
  }
  .eyebrow {
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--mute);
    margin: 0 0 10px;
  }
  h1 {
    font-size: 27px;
    line-height: 1.2;
    letter-spacing: -0.015em;
    font-weight: 600;
    margin: 0 0 14px;
  }
  p.lede {
    margin: 0 0 28px;
    color: var(--mute);
    font-size: 15px;
  }
  a.btn {
    display: block;
    padding: 15px 18px;
    border: 1px solid var(--ink);
    border-radius: 3px;
    text-decoration: none;
    color: var(--paper);
    background: var(--ink);
    font-weight: 500;
    text-align: center;
    margin-bottom: 10px;
  }
  a.btn.alt {
    background: transparent;
    color: var(--ink);
    border-color: var(--rule);
    font-weight: 400;
  }
  a.btn:focus-visible {
    outline: 2px solid var(--ink);
    outline-offset: 3px;
  }
  footer {
    margin-top: 26px;
    padding-top: 16px;
    border-top: 1px solid var(--rule);
    font-size: 13px;
    color: var(--mute);
  }
</style>
</head>
<body>

<main>
  <p class="eyebrow">Acacia HBC</p>
  <h1>Opening the presentation</h1>
  <p class="lede">If it doesn't open on its own, use a link below.</p>

  <a class="btn"     id="a-primary" href="#">Open the presentation</a>
  <a class="btn alt" id="a-mirror"  href="#">Open the PDF copy</a>

  <footer>Both links hold the same presentation.</footer>
</main>

<script>
  (function () {
    var dest = (TARGET === "mirror") ? MIRROR : PRIMARY;

    document.getElementById("a-primary").href = PRIMARY;
    document.getElementById("a-mirror").href  = MIRROR;

    // replace() keeps this page out of history, so Back doesn't trap the scanner
    window.location.replace(dest);
  })();
</script>

</body>
</html>
